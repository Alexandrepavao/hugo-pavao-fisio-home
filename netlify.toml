# HP Group Hub — Netlify
# Segredos NÃO ficam aqui. Chaves privilegiadas: variáveis da Netlify (escopo Functions).
# As chaves publishable do Supabase são públicas por design (protegidas por RLS).

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Ambiente do build por contexto de deploy. A vite.config.ts RECUSA o build se VITE_SUPABASE_URL não combinar com o ambiente
# (produção só com o banco de produção; preview/teste nunca com o de produção). As URLs/chaves em si ficam nas variáveis do
# site na Netlify — nunca no repositório.
[context.production.environment]
  VITE_APP_ENV = "production"
  VITE_RELEASE_PROFILE = "v1"

# Previews de desenvolvimento mostram tudo (perfil "full"); a branch de entrega mostra exatamente o que vai para produção (perfil "v1").
[context.deploy-preview.environment]
  VITE_APP_ENV = "preview"
  VITE_RELEASE_PROFILE = "full"

[context.branch-deploy.environment]
  VITE_APP_ENV = "preview"
  VITE_RELEASE_PROFILE = "full"

# PREVIEW fixo (site hp-group-hub, banco DEV): mesmo perfil da produção (v1) para testar exatamente o que vai ao ar. Publicado por `npm run preview:publicar`.
[context.preview.environment]
  VITE_APP_ENV = "preview"
  VITE_RELEASE_PROFILE = "v1"

[context."release/v1".environment]
  VITE_APP_ENV = "preview"
  VITE_RELEASE_PROFILE = "v1"

# `npm run dev` sobe o Vite na porta 8080 (vite.config.ts) — sem isto, `netlify dev` espera a porta
# padrão do Vite (5173) e nunca encontra o servidor.
[dev]
  command = "npm run dev"
  targetPort = 8080
  port = 8888

# Fallback de SPA: URLs internas (/admin, /checkup, /academy...) abrem direto.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
