# HP Group Hub — Netlify
# Segredos NÃO ficam aqui. Chaves privilegiadas: variáveis da Netlify (escopo Functions).
# As chaves publishable do Supabase são públicas por design (protegidas por RLS).

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Fallback de SPA: URLs internas (/admin, /checkup, /academy...) abrem direto.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
