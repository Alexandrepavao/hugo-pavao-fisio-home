name: Build and Deploy to GitHub Pages

# Desativado em 2026-09-23: o cutover de produção move hpfisioterapia.com.br para a Netlify (ver
# docs/deployment.md e docs/go-live-plan.md). Manter este workflow disparando em todo push a `main`
# publicaria o app inteiro (que depende de Netlify Functions/Edge Functions inexistentes no GitHub Pages)
# como se fosse o site institucional antigo, competindo com a publicação real. O deploy anterior
# permanece intacto na branch gh-pages e continua sendo servido enquanto o DNS não for repontado.
# Para publicar manualmente se necessário: Actions → este workflow → "Run workflow".
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build
        run: npm run build
      
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: hpfisioterapia.com.br
